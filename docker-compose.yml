# Local dev stack that mirrors the deployed runtime: Linux, Postgres, Redis,
# and the real forking RQ worker (no macOS fork workaround needed).
#
#   docker compose up --build      # first run builds the image (downloads torch)
#   open http://localhost:8000
#
# Drop a cookies.txt in the project root and set YTDLP_COOKIES_FILE=./cookies.txt
# in .env for YouTube Premium / ad-free downloads (browser cookies can't be read
# from inside a container).

x-app: &app
  build: .
  env_file: .env
  # These override anything in .env so the containers talk to the compose
  # services instead of localhost.
  environment:
    DATABASE_URL: postgresql://songcoach:songcoach@db:5432/songcoach
    REDIS_URL: redis://redis:6379/0
    RUN_JOBS_INLINE: "false"
    STORAGE_BACKEND: local
    LOCAL_STORAGE_DIR: /app/data
    YTDLP_COOKIES_FROM_BROWSER: ""   # no browser in a container; use a file instead
  volumes:
    - .:/app                         # live code (includes cookies.txt if present)
    - songcoach-data:/app/data       # stems shared between web + worker
    - model-cache:/root/.cache/torch # persist Demucs weights across restarts
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: songcoach
      POSTGRES_PASSWORD: songcoach
      POSTGRES_DB: songcoach
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U songcoach"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    <<: *app
    command: uvicorn songcoach.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: python worker.py

volumes:
  pg-data:
  songcoach-data:
  model-cache:
